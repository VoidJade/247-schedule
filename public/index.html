<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24/7 Schedule</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><header><div><div class="eyebrow">Always covered</div><h1>24/7 Schedule</h1><p>Shared hourly scheduling.</p></div><div id="account"></div></header><section id="loginCard" class="panel login-card"><h2>Sign in</h2><p>Enter the shared schedule password.</p><input id="password" type="password" placeholder="Password"><button id="loginBtn" class="btn">Log in</button><p id="loginError" class="error"></p></section><main id="app" hidden><div class="toolbar"><button id="logout" class="btn secondary">Log out</button><span id="roleText"></span></div><section class="grid-wrap"><div id="grid" class="grid"></div></section><section id="managerPanel" class="panel manager-panel" hidden><h2>Manage people</h2><div id="people"></div><p class="hint">Removing a person also removes all of their shifts.</p></section><p class="hint">Click an empty hour to add a shift. Click a filled hour to edit it. Your manager access is needed to remove people or shifts.</p></main></div><script src="/app.js"></script></body></html>
